[package]
name = "timetable-device-cpu"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
gtfs = { path = "../../gtfs" }
embedded-io-async = "0.7"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "abort"
