[package]
name = "timetable-firmware"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Rust timetable app for supported ESP32 touch displays"

# Keep the board's target and dependencies outside the hosted workspace.
[workspace]

[[bin]]
name = "timetable-display"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[features]
default = ["board-guition"]
board-guition = ["esp-hal?/esp32c3", "esp-rtos?/esp32c3", "esp-radio?/esp32c3", "esp-backtrace?/esp32c3", "esp-println?/esp32c3", "esp-bootloader-esp-idf?/esp32c3", "esp-storage?/esp32c3"]
board-waveshare-c6 = ["esp-hal?/esp32c6", "esp-rtos?/esp32c6", "esp-radio?/esp32c6", "esp-backtrace?/esp32c6", "esp-println?/esp32c6", "esp-bootloader-esp-idf?/esp32c6", "esp-storage?/esp32c6"]
c6-landscape = ["board-waveshare-c6"]
http-probe = []
firmware = [
    "dep:esp-hal", "dep:esp-rtos", "dep:esp-radio", "dep:esp-alloc",
    "dep:esp-backtrace", "dep:esp-println", "dep:esp-bootloader-esp-idf",
    "dep:embassy-executor", "dep:embassy-net", "dep:embassy-time",
    "dep:embassy-sync", "dep:static_cell", "dep:reqwless", "dep:log",
    "dep:portable-atomic",
    "dep:chacha20poly1305", "dep:esp-storage", "dep:embedded-storage", "dep:embedded-tls", "dep:spin",
]

[dependencies]
timetable-display = { path = "../display" }
gtfs = { path = "../gtfs" }
heapless = "0.9.3"
embedded-io-async = "0.7"
embedded-graphics = "0.8.2"
crc32fast = { version = "1", default-features = false }
embedded-hal = "1"
chacha20poly1305 = { version = "=0.10.1", default-features = false, optional = true }

esp-hal = { version = "=1.1.1", features = ["unstable", "log-04", "exception-handler"], optional = true }
esp-rtos = { version = "0.3", features = ["esp-radio", "embassy"], optional = true }
esp-radio = { version = "0.18", features = ["wifi", "log-04", "unstable"], optional = true }
esp-alloc = { version = "0.10", features = ["internal-heap-stats"], optional = true }
esp-backtrace = { version = "0.19", features = ["panic-handler", "println"], optional = true }
esp-println = { version = "0.17", default-features = false, features = ["jtag-serial", "log-04"], optional = true }
esp-bootloader-esp-idf = { version = "0.5", features = [], optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "tcp", "medium-ethernet", "udp"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-futures = "0.1"
static_cell = { version = "2", optional = true }
reqwless = { version = "0.14", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
# Both application cores are single core; the C3 lacks compare-and-swap.
portable-atomic = { version = "1", features = ["unsafe-assume-single-core"], optional = true }
esp-storage = { version = "0.9", features = ["bytewise-read"], optional = true }
embedded-storage = { version = "0.3", optional = true }

embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "p384", "rsa"], optional = true }
spin = { version = "0.9", default-features = false, features = ["portable_atomic", "lazy", "once", "mutex", "spin_mutex", "lock_api"], optional = true }

[dev-dependencies]
embassy-sync = "0.8"
portable-atomic = "1"
critical-section = { version = "1", features = ["std"] }
# Exercise the real certificate verifier and the same first-fit heap algorithm
# on the host, without bringing the radio or hardware into runtime libraries.
embedded-tls = { version = "=0.19.0", default-features = false, features = ["rustpki", "p384", "rsa"] }
linked_list_allocator = { version = "0.10", default-features = false }
reqwless = { version = "=0.14.0", default-features = false }
embedded-io = { version = "0.7", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"
chacha20poly1305 = { version = "=0.10.1", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
debug = 2
panic = "abort"
