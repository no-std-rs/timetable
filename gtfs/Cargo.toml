[package]
name = "gtfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Allocation-free, no_std streaming GTFS ZIP timetables, starting with Poznań"
license = "MIT OR Apache-2.0"
repository = "https://github.com/no-std-rs/timetable"
keywords = ["gtfs", "no-std", "embedded", "timetable", "transit"]
categories = ["no-std::no-alloc", "embedded", "parser-implementations"]

[dependencies]
embedded-io-async = { version = "0.7", default-features = false }
csv-core = { version = "0.1.13", default-features = false }
memchr = { version = "2", default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false }
crc32fast = { version = "1.5", default-features = false }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
reqwless = { version = "0.14", default-features = false }
embedded-nal-async = "0.9"
embedded-io-adapters = { version = "0.7", features = ["std", "tokio-1"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
stats_alloc = "0.1.10"

[lints.rust]
unsafe_code = "forbid"
