name: Device and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Android APK without SDK or NDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust targets
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustup target add armv7-linux-androideabi aarch64-linux-android
      - name: Cache checksum-pinned Android tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: android/.cache
          key: android-tools-${{ runner.os }}-${{ hashFiles('android/tools.json') }}
      - name: Check the native bridge in a real JVM
        run: sh tools/test-android-jni.sh
      - name: Build and verify the signed ARMv7 and ARM64 APK
        run: python3 android/build.py
      - name: Test the browser provisioning protocol
        run: |
          cargo fmt --manifest-path android/provisioner/Cargo.toml --check
          cargo test --manifest-path android/provisioner/Cargo.toml --locked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: timetable-android
          path: android/dist/
          if-no-files-found: error
          retention-days: 14
  build:
    name: C3 firmware and installer
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned firmware toolchain
        working-directory: firmware
        run: rustup show
      - name: Cache the pinned image builder
        id: image-builder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/espflash
          key: espflash-linux-4.4.0
      - if: steps.image-builder.outputs.cache-hit != 'true'
        run: cargo install espflash --version 4.4.0 --locked
      - name: Check the firmware
        working-directory: firmware
        run: |
          cargo fmt --all --check
          cargo test --lib --tests --locked --target x86_64-unknown-linux-gnu
          cargo check --example probe_transport --example probe_device --locked --target x86_64-unknown-linux-gnu
          cargo clippy --locked --release --features firmware -- -D warnings
      - name: Check the Waveshare C6 touch firmware
        working-directory: firmware
        run: |
          cargo test --locked --no-default-features --features board-waveshare-c6 --lib --test panel-c6 --test touch --target x86_64-unknown-linux-gnu
          cargo clippy --locked --release --no-default-features --features firmware,board-waveshare-c6 --target riscv32imac-unknown-none-elf -- -D warnings
      - name: Check the C6 landscape alternative
        working-directory: firmware
        run: |
          cargo test --locked --no-default-features --features c6-landscape --lib --test panel-c6 --test touch --target x86_64-unknown-linux-gnu
          cargo clippy --locked --release --no-default-features --features firmware,c6-landscape --target riscv32imac-unknown-none-elf -- -D warnings
      - name: Compile the allocation-free RV32 performance probe
        working-directory: checks/device-cpu
        run: |
          cargo fmt --all --check
          cargo build --locked --release
      - name: Build the factory image and enforce linked RAM and stack
        run: |
          sh tools/build-device-artifact.sh
          sh tools/build-device-artifact.sh dist/firmware/devices/waveshare-c6 waveshare-c6
          sh tools/build-device-artifact.sh dist/firmware/devices/waveshare-c6-landscape waveshare-c6-landscape
          python3 -c 'import json; assert not json.load(open("dist/firmware/latest.json"))["dirty"]'
          python3 -c 'import json; assert not json.load(open("dist/firmware/devices/waveshare-c6/latest.json"))["dirty"]'
          python3 -c 'import json; assert not json.load(open("dist/firmware/devices/waveshare-c6-landscape/latest.json"))["dirty"]'
          (cd dist/firmware && sha256sum --check SHA256SUMS)
          (cd dist/firmware/devices/waveshare-c6 && sha256sum --check SHA256SUMS)
          (cd dist/firmware/devices/waveshare-c6-landscape && sha256sum --check SHA256SUMS)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the pinned WebAssembly target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.95.0
      - name: Cache the pinned WebAssembly bindings generator
        id: wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-linux-0.2.129
      - if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: timetable-android
          path: android/dist
      - name: Build and test the installer
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Assemble the static installer
        run: python3 tools/assemble-installer.py dist/firmware dist/installer
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: timetable-display
          path: |
            dist/firmware/**
            dist/installer/**
          if-no-files-found: error
          retention-days: 14
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/installer
  pages:
    name: Publish installer
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
