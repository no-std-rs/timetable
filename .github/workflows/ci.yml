name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target riscv32imac-unknown-none-elf --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: |
            . -> target
            checks/ram -> ../../target
          cache-bin: 'false'
          cache-workspace-crates: 'true'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 display/tests/make_fixtures.py
      - run: git diff --exit-code -- display/tests/fixtures
      - run: cargo check -p gtfs --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo check -p timetable-display --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo check -p timetable-web-preview --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo check -p timetable-tablet --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/ram/Cargo.toml --check
      - run: python3 checks/check_ram.py
      - run: cargo run -p gtfs --release --example bench_stream -- gtfs/tests/fixtures/gtfs.zip 4 20261017 S1 1
