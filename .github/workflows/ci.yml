name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: rustup target add riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo check --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/ram/Cargo.toml --check
      - run: python3 checks/check_ram.py
      - run: cargo run --release --example bench_stream -- tests/fixtures/gtfs.zip 4 20261017 S1 1
