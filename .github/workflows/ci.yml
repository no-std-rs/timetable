name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: rustup target add riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 display/tests/make_fixtures.py
      - run: git diff --exit-code -- display/tests/fixtures
      - run: cargo check -p gtfs --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo check -p timetable-display --lib --locked --target riscv32imac-unknown-none-elf
      - run: cargo fmt --manifest-path checks/ram/Cargo.toml --check
      - run: python3 checks/check_ram.py
      - run: cargo run -p gtfs --release --example bench_stream -- gtfs/tests/fixtures/gtfs.zip 4 20261017 S1 1
